# Dependabot policy
#
# Why this file looks the way it does:
#   - Grouped minor/patch updates -> one reviewable PR instead of a flood.
#   - Major bumps of toolchain packages are ignored. They cannot resolve
#     against this repo's peer dependencies and previously produced PRs that
#     failed CI in ~6s and sat open forever.
#   - Dependabot SECURITY updates are unaffected by `ignore` and still open.
#
# To take a major upgrade deliberately, bump it by hand or temporarily
# remove the matching ignore rule.

version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    prod-minor-patch:
      dependency-type: production
      update-types:
      - minor
      - patch
    dev-minor-patch:
      dependency-type: development
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: typescript-eslint
    update-types:
    - version-update:semver-major
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  - dependency-name: eslint-config-next
    update-types:
    - version-update:semver-major
  - dependency-name: '@typescript-eslint/eslint-plugin'
    update-types:
    - version-update:semver-major
  - dependency-name: '@typescript-eslint/parser'
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/react'
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/react-dom'
    update-types:
    - version-update:semver-major
  - dependency-name: next
    update-types:
    - version-update:semver-major
  - dependency-name: react
    update-types:
    - version-update:semver-major
  - dependency-name: react-dom
    update-types:
    - version-update:semver-major
  - dependency-name: vite
    update-types:
    - version-update:semver-major
  - dependency-name: vitest
    update-types:
    - version-update:semver-major
  - dependency-name: '@vitejs/plugin-react'
    update-types:
    - version-update:semver-major
  - dependency-name: '@biomejs/biome'
    update-types:
    - version-update:semver-major
  - dependency-name: zod
    update-types:
    - version-update:semver-major
  - dependency-name: prisma
    update-types:
    - version-update:semver-major
  - dependency-name: '@prisma/client'
    update-types:
    - version-update:semver-major
  - dependency-name: tailwindcss
    update-types:
    - version-update:semver-major
  - dependency-name: '@eslint/js'
    update-types:
    - version-update:semver-major
